name: Хуулийн төслүүд татах (d.parliament.mn)

on:
  schedule:
    - cron: '30 20 * * *'   # өдөр бүр 04:30 (Улаанбаатар)
    - cron: '30 8 * * *'    # өдөр бүр 16:30 (Улаанбаатар)
  workflow_dispatch: {}       # гараар ажиллуулах товч

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  bills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-bills.mjs
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/bills.json data/bills-changes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Хуулийн төслүүд: шинэчлэл $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
